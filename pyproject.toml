[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ep133-krate"
# Versioning: v0.MINOR.PATCH — MINOR = new device features, PATCH = fixes
# Release: bump here → commit → git tag v0.1.0 → git push --tags
version = "0.1.0"
description = "Sample manager for the Teenage Engineering EP-133 KO-II"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Ivan Cherniukh"}]
keywords = ["midi", "ep133", "sampler", "teenage-engineering", "sysex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "mido>=1.3.0",
    "textual>=0.80.0",
    "rich>=13.0.0",
    "unidecode>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/icherniukh/ep133-krate"
Repository = "https://github.com/icherniukh/ep133-krate"
Issues = "https://github.com/icherniukh/ep133-krate/issues"

[project.scripts]
krate = "cli.cli_main:main"

[project.optional-dependencies]
desktop = [
    # python-rtmidi is required for local MIDI I/O on desktop, but it has no
    # iOS wheels and breaks Briefcase builds if installed as a hard dependency.
    "python-rtmidi>=1.5.0",
]
mobile = [
    "toga>=0.4.0",
    "rubicon-objc>=0.5.0",
]
# Briefcase config lives in mobile-app/pyproject.toml (separate from main
# project to avoid pulling desktop-only C extension deps into iOS builds).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.main]
ignore-patterns = [".*_pb2\\.py"]
ignore-paths = ["^\\.claude"]
fail-under = 8.5

[tool.pylint.messages-control]
disable = [
    "duplicate-code",             # R0801 — too noisy across modules
    "missing-module-docstring",   # C0114 — can add later
    "missing-class-docstring",    # C0115 — disabled by request
    "missing-function-docstring", # C0116 — can add later
    "raise-missing-from",         # W0707 — style preference
    "too-many-locals",            # R0914 — known complex functions
    "too-many-statements",        # R0915
    "too-many-branches",          # R0912
    "too-many-instance-attributes", # R0902 - common in UI classes
    "too-few-public-methods",     # R0903 - common for data structures
    "too-many-return-statements", # R0911 - common in state machines
    "too-many-arguments",         # R0913
    "too-many-positional-arguments", # R0917
    "import-outside-toplevel",    # C0415 - common in CLI/TUI to avoid slow startup
    "wrong-import-position",      # C0413 - ditto
    "wrong-import-order",         # C0411 - ditto
    "attribute-defined-outside-init", # W0201 - common in Toga/Textual startup
    "protected-access",           # W0212 - used carefully internally
    "line-too-long",              # C0301 — formatter handles this
    "no-member",                  # E1101 — wave module false positives (Wave_read vs Wave_write)
    "trailing-whitespace",        # C0303 - minor style issue
    "trailing-newlines",          # C0305 - minor style issue
    "multiple-statements",        # C0321 - minor style issue
    "unnecessary-pass",           # W0107 - minor style issue
    "invalid-name",               # C0103 - minor style issue
    "disallowed-name",            # C0104 - minor style issue
    "unnecessary-dunder-call",    # C2801 - minor style issue
    "f-string-without-interpolation", # W1309 - minor style issue
    "superfluous-parens",         # C0325 - minor style issue
]
