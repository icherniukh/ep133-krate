[project]
name = "krate-mobile"
version = "0.1.0"
description = "EP-133 KO-II mobile sample manager"
license.file = "LICENSE"
requires-python = ">=3.11"
authors = [{name = "Ivan Cherniukh"}]

# NOTE: No dependencies here — Briefcase uses [tool.briefcase.app.krate.requires]
# to install iOS-compatible packages only.
dependencies = []

[tool.briefcase]
project_name = "Krate"
bundle = "com.ep133"
version = "0.1.0"
author = "Ivan Cherniukh"
url = "https://github.com/icherniukh/ep133-krate"

[tool.briefcase.app.krate]
formal_name = "Krate"
description = "EP-133 KO-II sample manager"
# Source directories — copied into the app bundle.
# Paths are relative to this pyproject.toml.
# Symlinks point into the main src/ tree without including this ios/ dir.
sources = ["src/core", "src/app"]
requires = [
    "toga>=0.4.0",
    "rubicon-objc>=0.5.0",
    "std-nslog>=0.1.0",
]

[tool.briefcase.app.krate.iOS]
template = "./ios-template"
requires = [
    "toga-iOS>=0.4.0",
    "rubicon-objc>=0.5.0",
    "std-nslog>=0.1.0",
]

# ---- Info.plist keys ----
# Bluetooth for BLE MIDI (CoreMIDI uses BLE under the hood for wireless devices)
info.NSBluetoothAlwaysUsageDescription = "Krate uses Bluetooth for wireless BLE MIDI connections to the EP-133 KO-II."
info.NSBluetoothPeripheralUsageDescription = "Krate uses Bluetooth for wireless BLE MIDI connections to the EP-133 KO-II."

# ---- Entitlements ----
# com.apple.developer.midi — required for CoreMIDI access on iOS
entitlement."com.apple.developer.midi" = true

[tool.briefcase.app.krate.macOS]
requires = [
    "toga-cocoa>=0.4.0",
    "rubicon-objc>=0.5.0",
]
